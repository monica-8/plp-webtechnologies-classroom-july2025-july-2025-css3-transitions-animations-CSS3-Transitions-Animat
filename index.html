<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS & JavaScript Interactive Animations</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h1>CSS & JavaScript Interactive Animations</h1>

  <!-- Part 1: Button with transition and hover effect -->
  <button id="animatedButton" class="btn">Hover Over Me</button>

  <!-- Part 3: Box that will animate on button click -->
  <div id="animatedBox"></div>

  <!-- Controls Section -->
  <div class="controls">
    <button id="startAnimBtn">Start Animation</button>
    <button id="stopAnimBtn">Stop Animation</button>
  </div>

  <!-- Output result from function -->
  <p>Function Result: <span id="funcResult">---</span></p>

  <script src="script.js"></script>
</body>
</html>
